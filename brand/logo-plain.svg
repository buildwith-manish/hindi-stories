<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A2236"/>
      <stop offset="1" stop-color="#3E0F1E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#F5762E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F5762E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F5762E"/>
    </linearGradient>
  </defs>

  <!-- full-bleed square; YouTube crops this to a circle -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- warm glow behind the flame -->
  <circle cx="400" cy="500" r="230" fill="url(#glow)"/>

  <!-- house: walls + roof in one soft cream line -->
  <g fill="none" stroke="#FBE8C8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M252 418 V548 Q252 574 278 574 H522 Q548 574 548 548 V418"/>
    <path d="M200 432 L400 246 L600 432"/>
  </g>

  <!-- flame (diya light) -->
  <path d="M400 408 C437 452 463 484 463 518 C463 548 436 566 400 566 C364 566 337 548 337 518 C337 484 363 452 400 408 Z" fill="url(#flame)"/>
  <path d="M400 478 C418 500 430 515 430 534 C430 551 416 560 400 560 C384 560 370 551 370 534 C370 515 382 500 400 478 Z" fill="#FFF3D6" opacity="0.92"/>
</svg>
