name: Render videos

# Two parallel jobs, one per platform. Each job renders the WHOLE video in one piece
# (60 fps, 4 browser tabs), so there are no joins or seams to go wrong:
#   youtube-shorts            -> *-youtube.mp4  (YouTube Shorts end card)
#   instagram-facebook-reels  -> *-reels.mp4    (Instagram / Facebook Reels end card)

on:
  workflow_dispatch:
    inputs:
      stories:
        description: 'Story files to render, space-separated (e.g. stories/003-maa-2-baje.json). Leave empty or type "all" for every story.'
        required: false
        default: 'all'
  push:
    paths:
      - 'remotion/stories/**'
      - 'remotion/public/audio/**'

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: YouTube Shorts
            only: youtube
            suffix: youtube
            artifact: youtube-shorts
          - name: Instagram / Facebook Reels
            only: meta
            suffix: reels
            artifact: instagram-facebook-reels
    defaults:
      run:
        working-directory: remotion
    env:
      STORIES_INPUT: ${{ inputs.stories }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install system libraries for headless Chrome
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Pick stories
        id: pick
        run: |
          if [ -z "$STORIES_INPUT" ] || [ "$STORIES_INPUT" = "all" ]; then
            LIST=$(ls stories/*.json | tr '\n' ' ')
          else
            LIST="$STORIES_INPUT"
          fi
          echo "Rendering: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

      - name: Render ${{ matrix.name }} (4 tabs)
        env:
          LIST: ${{ steps.pick.outputs.list }}
        run: npm run render -- $LIST --only=${{ matrix.only }} --concurrency=4

      - name: Check the video is healthy (60 fps, 1080x1920, has audio)
        run: |
          shopt -s nullglob
          files=(out/*-${{ matrix.suffix }}.mp4)
          [ ${#files[@]} -gt 0 ] || { echo "No ${{ matrix.suffix }} video was produced"; exit 1; }
          for f in "${files[@]}"; do
            echo "== $f"
            V=$(npx remotion ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,nb_frames -of csv=p=0 "$f")
            A=$(npx remotion ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate -of csv=p=0 "$f")
            D=$(npx remotion ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            echo "video: $V | audio: $A | duration: $D s"
            case "$V" in 1080,1920,60/1,*) ;; *) echo "Expected 1080x1920 at 60 fps"; exit 1;; esac
            [ -n "$A" ] || { echo "No audio track in $f"; exit 1; }
            awk -v d="$D" 'BEGIN{exit !(d>20 && d<60)}' || { echo "Unexpected duration $D"; exit 1; }
          done
          ls -lh out/*-${{ matrix.suffix }}.mp4

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/*-${{ matrix.suffix }}.mp4; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Download it from **Artifacts** at the bottom of this page: \`${{ matrix.artifact }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cover image (thumbnail)
        if: matrix.only == 'youtube'
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail
          path: remotion/out/*-thumbnail.png
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ${{ matrix.name }} videos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: remotion/out/*-${{ matrix.suffix }}.mp4
          if-no-files-found: error
          retention-days: 30
